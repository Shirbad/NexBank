name: nexbank
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexbank
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      POSTGRES_DB: nexbank
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexbank -d nexbank"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  kafka:
    image: apache/kafka:3.8.0
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  auth-service:
    build: { context: ., dockerfile: auth-service/Dockerfile }
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: nexbank
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  account-service:
    build: { context: ., dockerfile: account-service/Dockerfile }
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: nexbank
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, kafka: { condition: service_started } }
  fraud-service:
    build: { context: ., dockerfile: fraud-service/Dockerfile }
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fraud_db
      SPRING_DATASOURCE_USERNAME: nexbank
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_API_URL: "${AI_API_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_started }, redis: { condition: service_healthy } }
  notification-service:
    build: { context: ., dockerfile: notification-service/Dockerfile }
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: nexbank
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_started } }
  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      FRAUD_SERVICE_URL: http://fraud-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
    depends_on: { auth-service: { condition: service_started }, account-service: { condition: service_started }, fraud-service: { condition: service_started }, notification-service: { condition: service_started }, redis: { condition: service_healthy } }
volumes: { pgdata: }
